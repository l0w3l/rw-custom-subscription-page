name: Build and publish Docker image

on:
  push:
    tags: ['v*']
    branches: [dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: 1owe1/rw-custom-subscription-page

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24.x'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Check backend
        working-directory: backend
        run: |
          npm ci
          npm test
          npm run typecheck
      - name: Setup frontend Node
        uses: actions/setup-node@v6
        with:
          node-version: '24.x'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run start:build
      - name: Upload frontend build
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: frontend/dist
          if-no-files-found: error
          retention-days: 1

  docker:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Download frontend build
        uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: frontend/dist
      - name: Select image tags
        id: image
        env:
          REF: ${{ github.ref }}
          EVENT: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          publish=false
          tags="${IMAGE}:sha-${GITHUB_SHA}"
          if [[ "$EVENT" != pull_request && "$REPOSITORY" == l0w3l/rw-custom-subscription-page ]]; then
            if [[ "$REF" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              publish=true
              tags="${IMAGE}:${REF#refs/tags/},${IMAGE}:latest,${tags}"
            elif [[ "$REF" == refs/heads/dev ]]; then
              publish=true
              tags="${IMAGE}:dev,${tags}"
            elif [[ "$REF" == refs/tags/* ]]; then
              echo 'Release tags must have the form v1.2.3' >&2
              exit 1
            fi
          fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Login to Docker Hub
        if: steps.image.outputs.publish == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and optionally publish
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ steps.image.outputs.publish == 'true' }}
          tags: ${{ steps.image.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
